name: CI/CD Web & Android Bundle

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  verify-web-app:
    name: Build & Lint Web Telemetry Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  release-tag:
    name: Create Tag & GitHub Release
    needs: verify-web-app
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.release_tag }}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Package Web Dist & Android Project Bundle
        run: |
          npm ci
          npm run build
          npx tsx -e "
            import fs from 'node:fs';
            import JSZip from 'jszip';
            import { ANDROID_PROJECT_FILES } from './src/data/androidProjectTemplate.js';
            const zip = new JSZip();
            for (const f of ANDROID_PROJECT_FILES) zip.file(f.path, f.content);
            const buf = await zip.generateAsync({ type: 'nodebuffer', compression: 'DEFLATE' });
            fs.writeFileSync('nordvpn-ikev2-explorer-android6-plus.zip', buf);
          "
          sha256sum nordvpn-ikev2-explorer-android6-plus.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "NordVPN IKEv2 Explorer ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          files: |
            nordvpn-ikev2-explorer-android6-plus.zip
            SHA256SUMS.txt
